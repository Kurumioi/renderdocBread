[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "replaylab-agenthost"
version = "1.10.1"
description = "Out-of-process AI provider and agent host for RenderDocUltra's built-in ReplayLab integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
model = [
  "genai-prices>=0.1.4,<1",
  "pydantic-ai-slim[openai,anthropic,google,mcp]>=2.34,<3",
]
acp = [
  "agent-client-protocol>=0.12,<1",
  "mcp>=1.29,<2",
]
litellm = [
  "litellm>=1.75,<2",
]
all = [
  "genai-prices>=0.1.4,<1",
  "pydantic-ai-slim[openai,anthropic,google,mcp]>=2.34,<3",
  "agent-client-protocol>=0.12,<1",
  "mcp>=1.29,<2",
]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
replaylab-ai = "replaylab_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/replaylab_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
